<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CyberOSINT logo">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38E8C4"/>
      <stop offset="1" stop-color="#1F9E86"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#38E8C4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38E8C4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#0A0E14"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#1C2634" stroke-width="4"/>
  <circle cx="256" cy="240" r="200" fill="url(#glow)"/>

  <!-- shield -->
  <path d="M256 70 L398 120 V238 C398 330 338 398 256 438 C174 398 114 330 114 238 V120 Z"
        fill="#0F151E" stroke="url(#edge)" stroke-width="14" stroke-linejoin="round"/>

  <!-- discovery ping around the target -->
  <path d="M164 236 A36 36 0 0 0 164 288" fill="none" stroke="#38E8C4" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <path d="M150 222 A52 52 0 0 0 150 302" fill="none" stroke="#38E8C4" stroke-opacity="0.25" stroke-width="7" stroke-linecap="round"/>

  <!-- evidence graph: target -> MCP server -> capabilities -->
  <g fill="none" stroke-width="9" stroke-linecap="round">
    <path d="M196 262 L240 262" stroke="#38E8C4"/>
    <path d="M262 262 C290 262 292 208 322 204" stroke="#38E8C4"/>
    <path d="M262 262 L328 262" stroke="#38E8C4"/>
    <path d="M262 262 C290 262 292 316 318 318" stroke="#F87171"/>
  </g>

  <!-- target node -->
  <circle cx="188" cy="262" r="17" fill="#0A0E14" stroke="#38E8C4" stroke-width="9"/>
  <!-- MCP server (hub) -->
  <rect x="233" y="239" width="46" height="46" rx="8" transform="rotate(45 256 262)" fill="#38E8C4"/>
  <!-- capability nodes -->
  <circle cx="334" cy="204" r="15" fill="#38E8C4"/>
  <circle cx="340" cy="262" r="15" fill="#38E8C4"/>
  <circle cx="330" cy="318" r="18" fill="#F87171"/>
  <circle cx="330" cy="318" r="29" fill="none" stroke="#F87171" stroke-opacity="0.45" stroke-width="5"/>
</svg>
