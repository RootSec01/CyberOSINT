name: raqeeb

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: raqeeb
      POSTGRES_USER: raqeeb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raqeeb -d raqeeb"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://raqeeb:${POSTGRES_PASSWORD}@db:5432/raqeeb
      CORS_ALLOW_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
      PUBLIC_SITE_URL: https://${DOMAIN}
    volumes:
      - evidence:/app/evidence
    depends_on:
      db:
        condition: service_healthy

  showcase:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: showcase
    restart: unless-stopped
    environment:
      SHOWCASE_ADMIN_USER: ${SHOWCASE_ADMIN_USER:-rami}
      SHOWCASE_ADMIN_PASSWORD: ${SHOWCASE_ADMIN_PASSWORD:?set SHOWCASE_ADMIN_PASSWORD in .env}
      SHOWCASE_VIEWER_USER: ${SHOWCASE_VIEWER_USER:-viewer}
      SHOWCASE_VIEWER_PASSWORD: ${SHOWCASE_VIEWER_PASSWORD:-}
      SHOWCASE_JWT_SECRET: ${SHOWCASE_JWT_SECRET:?set SHOWCASE_JWT_SECRET in .env}
      SHOWCASE_OWNERSHIP_SECRET: ${SHOWCASE_OWNERSHIP_SECRET:?set SHOWCASE_OWNERSHIP_SECRET in .env}
      SHOWCASE_ORIGIN: https://${DOMAIN}:8443
      TIMEZONE: ${TIMEZONE:-Asia/Dubai}
    networks:
      - showcase

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    networks:
      - default
      - showcase
    depends_on:
      - app
      - showcase

networks:
  showcase:
    internal: true

volumes:
  database:
  evidence:
  certificates:
  caddy_config:
