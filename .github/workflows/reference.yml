name: reference

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: reference
  cancel-in-progress: false

jobs:
  # Runs third-party package code, so it gets a read-only token and no stored credentials.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: python -m reference build --latest 40

      - uses: actions/upload-artifact@v4
        with:
          name: reference-data
          path: reference/data
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: reference-data
          path: reference/data

      - name: Commit new releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/data
          git diff --cached --quiet && exit 0
          git commit -m "reference: releases as of $(date -u +%F)"
          git pull --rebase
          git push
