name: evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "evaluation/**"
      - "raqeeb/mcp_detectors.py"
      - "raqeeb/mcp_protocol.py"
      - "reference/data/index.json"

concurrency:
  group: evaluation
  cancel-in-progress: false

env:
  LAB_REPOSITORY: harishsg993010/damn-vulnerable-MCP-server
  LAB_COMMIT: cdc4c6b5b76353203effcb26058e50fa6067d3a6
  BENCHMARK_REPOSITORY: zhiqiangwang4/MCPTox-Benchmark
  BENCHMARK_COMMIT: f85189f9ad12504c197c7f920ab818a40657b1fa

jobs:
  # Starts the lab's deliberately vulnerable servers, so it runs with a read-only token.
  dvmcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LAB_REPOSITORY }}
          ref: ${{ env.LAB_COMMIT }}
          path: lab-under-test
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Install the lab in its own environment
        run: |
          python -m venv lab-env
          lab-env/bin/pip install -r lab-under-test/requirements.txt

      - run: python -m evaluation.dvmcp --lab lab-under-test --python lab-env/bin/python

      - uses: actions/upload-artifact@v4
        with:
          name: dvmcp-results
          path: evaluation/dvmcp_results.json
          retention-days: 3

  # Reads the benchmark's data files only; nothing from it is executed or stored here.
  mcptox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BENCHMARK_REPOSITORY }}
          ref: ${{ env.BENCHMARK_COMMIT }}
          path: benchmark-under-test
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python -m evaluation.mcptox --benchmark benchmark-under-test

      - uses: actions/upload-artifact@v4
        with:
          name: mcptox-results
          path: evaluation/mcptox_results.json
          retention-days: 3

  publish:
    needs: [dvmcp, mcptox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: evaluation
          merge-multiple: true

      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/dvmcp_results.json evaluation/mcptox_results.json
          git diff --cached --quiet && exit 0
          git commit -m "evaluation: results"
          git pull --rebase
          git push
